name: Docker CI

on:
  push:
    branches:
      - main
      - first-copy
  pull_request:
    branches:
      - main
      - first-copy

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Run code checks
        working-directory: src
        run: npm run check

  docker:
    name: Build, test, and tag Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: vars
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          REF_TAG="$(echo "${GITHUB_REF_NAME}" | tr '/_' '--' | tr -cd '[:alnum:].-')"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "ci_tag=${IMAGE}:ci-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${IMAGE}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "ref_tag=${IMAGE}:${REF_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image
        run: docker build -t "${{ steps.vars.outputs.ci_tag }}" .

      - name: Test Docker image
        shell: bash
        run: |
          docker run --rm -d --name ssvd-bhoomi-report -p 3000:3000 "${{ steps.vars.outputs.ci_tag }}"

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            sleep 2
          done

          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent --output /dev/null http://localhost:3000/

      - name: Show container logs on failure
        if: failure()
        run: docker logs ssvd-bhoomi-report || true

      - name: Stop test container
        if: always()
        run: docker stop ssvd-bhoomi-report || true

      - name: Tag Docker image
        run: |
          docker tag "${{ steps.vars.outputs.ci_tag }}" "${{ steps.vars.outputs.sha_tag }}"
          docker tag "${{ steps.vars.outputs.ci_tag }}" "${{ steps.vars.outputs.ref_tag }}"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image tags
        if: github.event_name == 'push'
        run: |
          docker push "${{ steps.vars.outputs.sha_tag }}"
          docker push "${{ steps.vars.outputs.ref_tag }}"
